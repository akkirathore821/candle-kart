  # ======================
  # EUREKA SERVER
  # ======================
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - backend-network

  # ======================
  # API GATEWAY
  # ======================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"   # host:container
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - eureka-server
    networks:
      - backend-network


  # ======================
  # CONNECTION
  # ======================
  connection:
    build: ./connection
    container_name: connection
    ports:
      - "8088:8080"   # host:container
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - eureka-server
    networks:
      - backend-network

  # ======================
  # AUTH SERVICE
  # ======================
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8080"   # host:container
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - eureka-server
    networks:
      - backend-network

  # ======================
  # USER SERVICE
  # ======================
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8082:8080"   # host:container
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - eureka-server
    networks:
      - backend-network

# ======================
# VOLUMES
# ======================
volumes:
  postgres_data:

# ======================
# NETWORK
# ======================
networks:
  backend-network:
    driver: bridge

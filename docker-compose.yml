version: "3.9"

services:

  # ======================
  # DATABASE
  # ======================
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: akshayrathore
      POSTGRES_PASSWORD: root
      POSTGRES_DB: candlekart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network


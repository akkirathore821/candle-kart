server:
  address: 0.0.0.0
  port: 8080   # internal container port

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:

        - id: connection
          uri: lb://connection
          predicates:
            - Path=/api/public/connection/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/admin/product/**,/api/public/product/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/admin/user/**,/api/user/user/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/public/auth/**,/api/user/auth/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/admin/inventory/**

        - id: elasticsearch-service
          uri: lb://elasticsearch-service
          predicates:
            - Path=/api/public/search/**,/api/admin/search/**

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/user/cart/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/admin/order/**,/api/user/order/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    hostname: api-gateway
    prefer-ip-address: true
